<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Fullscreen Image Zoom</title>
    <style>
        /* Remove default margins and hide scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111; /* Dark background looks better fullscreen */
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none; /* Prevents accidental text/image selection while dragging */
        }

        /* Container takes up 100% of the viewport */
        .image-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: zoom-in;
        }

        /* Image handles the scaling and translation smoothly */
        .zoom-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps image proportions without cropping */
            transform-origin: 0 0; /* Necessary for accurate mouse/wheel tracking */
            transition: transform 0.05s ease-out; /* Keeps adjustments buttery smooth */
            will-change: transform;
        }

        /* Grabbing cursor state while dragging */
        .image-container.is-dragging {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div class="image-container" id="zoomContainer">
        <!-- Replace with your image path -->
        <img src="https://deltarune.wiki/images/Ferris_Wheel_soundtrack.png?cb=7cpc1b&h=thumb.php&f=Ferris_Wheel_soundtrack.png" alt="Fullscreen target" class="zoom-image" id="zoomImage">
    </div>

    <script>
        const container = document.getElementById('zoomContainer');
        const image = document.getElementById('zoomImage');

        // State tracking variables
        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        // Configuration limits
        const MIN_SCALE = 1;
        const MAX_SCALE = 6; // Feel free to increase this for deeper zoom

        // Helper function to update the CSS Transform property dynamically
        function updateTransform() {
            image.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // --- WHEEL ZOOM (Scroll to zoom deeper) ---
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            // Adjust zoom speed factor
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            const delta = -e.deltaY;

            if (delta > 0) {#
                scale = Math.min(MAX_SCALE, scale + 0.3);
            } else {
                scale = Math.max(MIN_SCALE, scale - 0.3);
            }

            // Reposition the image offset so it zooms directly into the mouse cursor
            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;

            // Restrict bounds if zoomed completely out
            if (scale === 1) {
                pointX = 0;
                pointY = 0;
                container.style.cursor = 'zoom-in';
            } else {
                container.style.cursor = 'grab';
            }

            updateTransform();
        }, { passive: false });

        // --- CLICK TO TOGGLE ZOOM ---
        container.addEventListener('click', (e) => {
            // Ignore the toggle if we just finished dragging the image
            if (isDragging) return;

            if (scale === 1) {
                // Zoom in to a comfortable starting level (e.g., 2.5x)
                scale = 2.5;
                const xs = e.clientX / 1;
                const ys = e.clientY / 1;
                pointX = e.clientX - xs * scale;
                pointY = e.clientY - ys * scale;
                container.style.cursor = 'grab';
            } else {
                // Zoom completely back out
                scale = 1;
                pointX = 0;
                pointY = 0;
                container.style.cursor = 'zoom-in';
            }
            updateTransform();
        });

        // --- CLICK & DRAG PANNING ---
        container.addEventListener('mousedown', (e) => {
            if (scale === 1) return; // Don't drag if zoomed out
            
            isDragging = false; // Reset toggle flag
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            
            // We attach mousemove to window so the drag doesn't snap if mouse leaves container
            window.addEventListener('mousemove', mouseMoveHandler);
            window.addEventListener('mouseup', mouseUpHandler);
        });

        function mouseMoveHandler(e) {
            isDragging = true;
            container.classList.add('is-dragging');
            
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            
            updateTransform();
        }

        function mouseUpHandler() {
            container.classList.remove('is-dragging');
            window.removeEventListener('mousemove', mouseMoveHandler);
            window.removeEventListener('mouseup', mouseUpHandler);
            
            // Short timeout ensures the click event knows a drag just finished
            setTimeout(() => { isDragging = false; }, 50);
        }
    </script>

</body>
</html>
