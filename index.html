<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Fullscreen Image Zoom</title>
    <style>
        /* Force full screen and prevent standard scrolling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Container scales to the exact window size */
        .image-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        .image-container:active {
            cursor: grabbing;
        }

        /* Image default centered positioning */
        .zoom-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="image-container" id="zoomContainer">
        <img src="Ferris_Wheel_soundtrack.png" alt="Fullscreen target" class="zoom-image" id="zoomImage"
    </div>

    <script>
        const container = document.getElementById('zoomContainer');
        const image = document.getElementById('zoomImage');

        // State positions
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Limits
        const MIN_SCALE = 1;
        const MAX_SCALE = 8; // Allows up to 8x close-up zoom

        // Applies updates reliably via CSS transform matrix
        function applyTransform() {
            image.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // --- 1. MOUSE WHEEL ZOOM ---
        container.addEventListener('wheel', (e) => {
            e.preventDefault();

            // Calculate zoom target step
            const zoomFactor = 0.15;
            let targetScale = scale + (e.deltaY < 0 ? zoomFactor : -zoomFactor);
            
            // Constrain zoom levels
            targetScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));

            if (targetScale === scale) return;

            // Get mouse position relative to image center bounding box
            const rect = image.getBoundingClientRect();
            const mouseX = e.clientX - (rect.left + rect.width / 2);
            const mouseY = e.clientY - (rect.top + rect.height / 2);

            // Adjust offset positions so it zooms focused directly under the cursor mouse point
            translateX -= (mouseX / scale) * (targetScale - scale);
            translateY -= (mouseY / scale) * (targetScale - scale);
            
            scale = targetScale;

            // Reset positioning if fully zoomed back out
            if (scale <= MIN_SCALE) {
                scale = 1;
                translateX = 0;
                translateY = 0;
            }

            applyTransform();
        }, { passive: false });

        // --- 2. DOUBLE CLICK TO QUICK SNAP ZOOM ---
        container.addEventListener('dblclick', (e) => {
            if (scale > 1) {
                // If already zoomed in, snap back out entirely
                scale = 1;
                translateX = 0;
                translateY = 0;
            } else {
                // Quick snap into a 3x magnification factor
                scale = 3;
                const rect = image.getBoundingClientRect();
                const mouseX = e.clientX - (rect.left + rect.width / 2);
                const mouseY = e.clientY - (rect.top + rect.height / 2);
                translateX = -mouseX * (scale - 1);
                translateY = -mouseY * (scale - 1);
            }
            applyTransform();
        });

        // --- 3. CLICK & DRAG PANNING ---
        container.addEventListener('mousedown', (e) => {
            if (scale === 1) return; // Disable dragging if completely zoomed out
            
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>

</body>
</html>
